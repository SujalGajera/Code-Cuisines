name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── JOB 1: Security checks ─────────────────────────────────────────────
  security-tests:
    name: Security Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Gitleaks to scan full commit history

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Dependency Vulnerability Scanning (npm audit)
        run: npm audit --audit-level=high || true

  # ── JOB 2: Code quality & tests ────────────────────────────────────────
  quality-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    needs: security-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint (static code analysis)
        run: npx eslint src/ --ext .js,.jsx --max-warnings=50 || true

      - name: Run automated tests (Jest + RTL)
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

  # ── JOB 3: Build & Deploy ──────────────────────────────────────────────
  build-and-deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest
    needs: quality-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        env:
          CI: false
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CODECUISINEFB }}
          channelId: ${{ github.event_name == 'pull_request' && 'pr' || 'live' }}
          projectId: codecuisinefb
