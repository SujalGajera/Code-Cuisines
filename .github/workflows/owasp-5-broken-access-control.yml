name: OWASP - Broken Access Control

on:
  push:
    branches: [ "main" ]

jobs:
  access-control-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for insecure Firebase rules
        run: |
          if grep -r 'allow read, write: if true' . --exclude-dir=.github; then
            echo "Critical: Public access detected"
            exit 1
          else
            echo "No public access rule found"
          fi

      - name: Check for missing role validation
        run: |
          if ! grep -r 'role' src/; then
            echo "Warning: No role-based access control found"
          else
            echo "Role-based access control detected"
          fi

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: CI=false npm run build
